
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d0f;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
        }

        .container {
            max-width: 520px;
        }

        .logo {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 60px;
            color: #888;
        }

        h1 {
            font-size: clamp(36px, 8vw, 58px);
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        p {
            color: #888;
            font-size: 16px;
            line-height: 1.7;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 32px;
            padding: 10px 16px;
            border: 1px solid #29292e;
            border-radius: 30px;
            color: #aaa;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4c3cff;
            box-shadow: 0 0 10px #4c3cff;
        }

        footer {
            position: absolute;
            bottom: 28px;
            color: #444;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="logo">Nomber Projects</div>

        <h1>Something is<br>in the works.</h1>

        <p>
            We're building something new.
            This website is currently under development.
            Stay tuned for updates.
        </p>

        <div class="status">
            <span class="dot"></span>
            Under Development
        </div>
    </main>

    <footer>© 2026 Nomber Projects</footer>
</body>
</html>
